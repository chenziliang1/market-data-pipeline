# Installed as /opt/tradedate/nginx/default.conf. The upstream named "app" is defined in
# upstream.conf next to it, which the deploy rewrites to point at the active slot.
server {
    listen 8080;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Loading a year of candles takes about 30 seconds.
        proxy_read_timeout 300s;
    }
}
