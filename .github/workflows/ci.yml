name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Deploys of the same branch run one at a time, in push order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs unit tests and the Testcontainers integration tests (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: ./mvnw -B verify

  # Publishes an image for every pushed commit that passed the tests, tagged with the commit SHA and the branch.
  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.repo }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the commit's image to EC2 through AWS Systems Manager. Off until the repository variables
  # DEPLOY_ENABLED=true and DEPLOY_BRANCH are set; see deploy/README.md for the one-time AWS setup.
  # To roll back, re-run this job from an earlier successful run.
  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true' && github.ref_name == vars.DEPLOY_BRANCH
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deploy/ssm-deploy.sh
