name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs unit tests and the Testcontainers integration tests (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: ./mvnw -B verify
