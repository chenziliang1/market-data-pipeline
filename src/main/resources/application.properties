spring.config.import=optional:file:./.env[.properties]
spring.application.name=demo
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
mybatis.configuration.map-underscore-to-camel-case=true
# Schema changes are Flyway migrations in src/main/resources/db/migration, applied at startup.
# A database created before Flyway (tables but no history) is baselined at version 0, so the
# idempotent V1 runs as a no-op and later migrations apply normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.kafka.topics.trade-data=${KAFKA_TRADE_DATA_TOPIC:trade-data}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=${app.kafka.topics.trade-data}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:demo-trade-data-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
# Upper bound on candles written by one multi-row upsert (9 parameters each, far below PostgreSQL's 65,535).
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:500}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer turns a malformed record into an error the listener's error handler
# can route to the dead-letter topic, instead of failing the same poll forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.entity
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.entity.TradeData
app.kafka.topics.trade-data-dlt=${KAFKA_TRADE_DATA_DLT_TOPIC:${app.kafka.topics.trade-data}.DLT}
app.kafka.retry.max-retries=${KAFKA_RETRY_MAX_RETRIES:3}
app.kafka.retry.initial-interval=${KAFKA_RETRY_INITIAL_INTERVAL:PT1S}
# A replayed dead letter that fails again comes back with a higher count; past this it is no longer republished.
app.kafka.dlt.max-replays=${KAFKA_DLT_MAX_REPLAYS:3}
binance.api.base-url=${BINANCE_API_BASE_URL:https://api.binance.us}
app.binance.max-range=${BINANCE_MAX_RANGE:P366D}
app.binance.max-concurrent-requests=${BINANCE_MAX_CONCURRENT_REQUESTS:4}
app.binance.max-attempts=${BINANCE_MAX_ATTEMPTS:3}
app.binance.retry-backoff=${BINANCE_RETRY_BACKOFF:PT1S}
app.cache.aggregate.closed-ttl=${AGGREGATE_CACHE_CLOSED_TTL:PT1H}
app.cache.aggregate.open-ttl=${AGGREGATE_CACHE_OPEN_TTL:PT1M}
# Required in the X-API-Key header for /api/load/** and /api/admin/**. Unset means those endpoints are refused.
app.security.api-key=${APP_API_KEY:}

kimi.api.url=${KIMI_API_URL:https://api.moonshot.ai/v1/chat/completions}
kimi.api.key=${MOONSHOT_API_KEY:}
kimi.model=${KIMI_MODEL:kimi-k3}

app.terminal-chat.enabled=${TERMINAL_CHAT_ENABLED:false}

# Only the health endpoint is exposed; the deploy job polls it, and it reports DOWN when PostgreSQL or Redis is unreachable.
management.endpoints.web.exposure.include=health

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.com.zaxxer.hikari=WARN
