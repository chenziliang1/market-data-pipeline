spring.config.import=optional:file:./.env[.properties]
spring.application.name=demo
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
mybatis.configuration.map-underscore-to-camel-case=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
app.kafka.topics.trade-data=${KAFKA_TRADE_DATA_TOPIC:trade-data}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=${app.kafka.topics.trade-data}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:demo-trade-data-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.demo.entity
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.demo.entity.TradeData
binance.api.base-url=${BINANCE_API_BASE_URL:https://api.binance.us}

kimi.api.url=${KIMI_API_URL:https://api.moonshot.ai/v1/chat/completions}
kimi.api.key=${MOONSHOT_API_KEY:}
kimi.model=${KIMI_MODEL:kimi-k3}

app.terminal-chat.enabled=${TERMINAL_CHAT_ENABLED:false}

logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.com.zaxxer.hikari=WARN
